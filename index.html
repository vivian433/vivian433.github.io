<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux 地图探险游戏</title>
<style>
  /* ======= 全局重置 & 字体 ======= */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500;700&display=swap');

  :root {
    --bg-dark: #0a0e1a;
    --bg-panel: #0d1530;
    --bg-card: #111827;
    --neon-green: #00ff88;
    --neon-blue: #00c8ff;
    --neon-purple: #b44fff;
    --neon-gold: #ffd700;
    --neon-red: #ff4466;
    --neon-cyan: #00ffff;
    --text-main: #e0e8ff;
    --text-dim: #7a8baa;
    --border-glow: rgba(0, 200, 255, 0.3);
    --shadow-neon: 0 0 20px rgba(0, 200, 255, 0.4);
  }

  html, body {
    height: 100%;
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Noto Sans SC', 'Share Tech Mono', monospace;
    overflow-x: hidden;
  }

  /* ======= 星空背景 ======= */
  #stars-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s infinite alternate;
  }
  @keyframes twinkle {
    0%   { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 1;   transform: scale(1.2); }
  }

  /* ======= 主容器 ======= */
  #app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
  }

  /* ======= 标题屏 ======= */
  #screen-title {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    text-align: center;
  }

  .game-logo {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--neon-green) 0%, var(--neon-blue) 50%, var(--neon-purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.5));
    margin-bottom: 8px;
  }

  .game-subtitle {
    font-size: 1.1rem;
    color: var(--neon-cyan);
    letter-spacing: 2px;
    margin-bottom: 16px;
    opacity: 0.85;
  }

  .terminal-tagline {
    font-family: 'Share Tech Mono', monospace;
    color: var(--neon-green);
    font-size: 0.9rem;
    margin-bottom: 50px;
    opacity: 0.7;
  }
  .terminal-tagline::before { content: '$ '; color: var(--neon-gold); }

  .input-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 36px;
  }
  .input-label {
    color: var(--neon-blue);
    font-size: 0.95rem;
    letter-spacing: 1px;
  }
  .styled-input {
    background: rgba(0, 200, 255, 0.07);
    border: 1.5px solid var(--neon-blue);
    border-radius: 8px;
    color: #fff;
    font-size: 1.1rem;
    padding: 12px 24px;
    outline: none;
    text-align: center;
    width: 280px;
    transition: box-shadow 0.3s;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .styled-input:focus {
    box-shadow: 0 0 16px rgba(0, 200, 255, 0.5);
  }

  .btn-start {
    background: linear-gradient(135deg, #00c8ff, #00ff88);
    border: none;
    border-radius: 10px;
    color: #0a0e1a;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 16px 52px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 24px rgba(0, 200, 255, 0.4);
  }
  .btn-start:hover {
    transform: scale(1.06);
    box-shadow: 0 0 40px rgba(0, 200, 255, 0.7);
  }

  .info-cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    max-width: 900px;
    margin-top: 40px;
  }
  .info-card {
    background: rgba(13, 21, 48, 0.8);
    border: 1px solid var(--border-glow);
    border-radius: 12px;
    padding: 18px 24px;
    width: 160px;
    text-align: center;
    backdrop-filter: blur(6px);
    transition: transform 0.2s;
  }
  .info-card:hover { transform: translateY(-4px); }
  .info-card .ic-icon { font-size: 2.2rem; margin-bottom: 8px; }
  .info-card .ic-title { font-size: 0.8rem; color: var(--neon-blue); letter-spacing: 1px; margin-bottom: 4px; font-family: 'Orbitron', sans-serif; }
  .info-card .ic-desc { font-size: 0.78rem; color: var(--text-dim); line-height: 1.5; }

  /* ======= 地图屏 ======= */
  #screen-map {
    display: none;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
    padding: 14px 24px;
    background: rgba(13, 21, 48, 0.9);
    border: 1px solid var(--border-glow);
    border-radius: 12px;
    backdrop-filter: blur(8px);
  }
  .top-bar-left { display: flex; align-items: center; gap: 14px; }
  .player-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: bold; color: #0a0e1a;
  }
  .player-info-text .player-name {
    font-size: 1rem; font-weight: 700; color: var(--neon-cyan);
  }
  .player-info-text .player-rank {
    font-size: 0.75rem; color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
  }
  .score-display {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    color: var(--neon-gold);
    text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
  }
  .score-display span { font-size: 0.75rem; color: var(--text-dim); margin-right: 4px; }

  .progress-section { text-align: center; }
  .progress-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 5px; font-family: 'Share Tech Mono', monospace; }
  .progress-bar-wrap { width: 180px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--neon-green), var(--neon-blue)); border-radius: 5px; transition: width 0.5s; }

  .map-header {
    text-align: center;
    margin-bottom: 36px;
  }
  .map-title-text {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    color: var(--neon-cyan);
    letter-spacing: 3px;
    text-shadow: 0 0 16px rgba(0, 255, 255, 0.4);
  }
  .map-subtitle-text {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 6px;
    font-family: 'Share Tech Mono', monospace;
  }

  .map-container {
    position: relative;
    max-width: 860px;
    margin: 0 auto;
  }

  .map-path-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .zones-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    position: relative;
    z-index: 1;
    padding: 20px 0;
  }

  @media (max-width: 700px) {
    .zones-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) {
    .zones-grid { grid-template-columns: 1fr; }
  }

  .zone-card {
    position: relative;
    background: var(--bg-card);
    border-radius: 16px;
    padding: 22px 16px 18px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s;
    border: 2px solid transparent;
    overflow: hidden;
  }
  .zone-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(255,255,255,0.04), transparent);
    pointer-events: none;
  }

  .zone-card.locked {
    opacity: 0.45;
    cursor: not-allowed;
    filter: grayscale(0.6);
  }
  .zone-card.available {
    border-color: var(--neon-blue);
    box-shadow: var(--shadow-neon);
    animation: pulse-glow 2.5s ease-in-out infinite;
  }
  .zone-card.completed {
    border-color: var(--neon-green);
    box-shadow: 0 0 16px rgba(0, 255, 136, 0.3);
  }
  .zone-card.completed .zone-badge {
    background: var(--neon-green);
    color: #0a0e1a;
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 12px rgba(0, 200, 255, 0.3); }
    50% { box-shadow: 0 0 28px rgba(0, 200, 255, 0.6); }
  }

  .zone-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(0, 200, 255, 0.15);
    color: var(--neon-blue);
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 1.2rem;
    margin-bottom: 10px;
  }
  .zone-name {
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--text-main);
  }
  .zone-desc {
    font-size: 0.72rem;
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
    margin-bottom: 8px;
  }
  .zone-qcount {
    font-size: 0.7rem;
    color: var(--neon-gold);
    font-family: 'Share Tech Mono', monospace;
  }

  /* Boss关卡卡片特效 */
  .zone-card.boss-zone {
    border: 2px solid #ff6b35;
    background: linear-gradient(135deg, var(--bg-card), rgba(255, 107, 53, 0.08));
  }
  .zone-card.boss-zone.available {
    border-color: #ff6b35;
    box-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
    animation: boss-pulse 2s ease-in-out infinite;
  }
  .zone-card.boss-zone.completed {
    border-color: #ff6b35;
    box-shadow: 0 0 16px rgba(255, 107, 53, 0.4);
  }
  .zone-card.boss-zone.completed .zone-badge {
    background: #ff6b35;
    color: #0a0e1a;
  }
  @keyframes boss-pulse {
    0%, 100% { box-shadow: 0 0 12px rgba(255, 107, 53, 0.3); }
    50% { box-shadow: 0 0 32px rgba(255, 107, 53, 0.7); }
  }
  .zone-boss-badge {
    position: absolute;
    top: 8px; left: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    font-weight: 900;
    color: #ff6b35;
    letter-spacing: 2px;
  }
  .zone-boss-hint {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 6px;
    font-style: italic;
  }

  /* Boss场景描述卡 */
  .boss-scenario {
    text-align: center;
    padding: 16px 8px;
    animation: fadeIn 0.5s ease;
  }
  .boss-scenario-icon {
    font-size: 3rem;
    margin-bottom: 12px;
  }
  .boss-scenario-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    color: #ff6b35;
    letter-spacing: 2px;
    margin-bottom: 16px;
  }
  .boss-scenario-text {
    font-size: 0.88rem;
    color: var(--text-main);
    line-height: 1.7;
    text-align: left;
    padding: 16px 20px;
    background: rgba(255, 107, 53, 0.06);
    border-left: 3px solid #ff6b35;
    border-radius: 0 10px 10px 0;
    margin-bottom: 14px;
  }
  .boss-scenario-hint {
    font-size: 0.8rem;
    color: var(--neon-gold);
    font-family: 'Share Tech Mono', monospace;
  }

  .zone-lock-icon {
    position: absolute;
    top: 10px; right: 12px;
    font-size: 1rem;
    opacity: 0.5;
  }
  .zone-check-icon {
    position: absolute;
    top: 10px; right: 12px;
    font-size: 1.2rem;
    color: var(--neon-green);
  }

  /* ======= 答题屏 ======= */
  #screen-quiz {
    display: none;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .quiz-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
    padding: 12px 20px;
    background: rgba(13, 21, 48, 0.9);
    border: 1px solid var(--border-glow);
    border-radius: 12px;
    backdrop-filter: blur(8px);
  }
  .quiz-zone-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.95rem;
    color: var(--neon-cyan);
    letter-spacing: 1px;
  }
  .quiz-progress-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    color: var(--neon-gold);
  }
  .quiz-score-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    color: var(--neon-green);
  }

  /* 答题进度条 */
  .quiz-progress-bar {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .quiz-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
    border-radius: 4px;
    transition: width 0.4s;
  }

  /* 题目卡片 */
  .question-card {
    max-width: 720px;
    margin: 0 auto;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    padding: 32px 28px 24px;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 4px;
    background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
  }

  .q-number {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--neon-blue);
    margin-bottom: 12px;
    letter-spacing: 1px;
  }
  .q-type-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-family: 'Share Tech Mono', monospace;
    margin-left: 8px;
  }
  .q-type-badge.single { background: rgba(0, 200, 255, 0.15); color: var(--neon-blue); }
  .q-type-badge.multi  { background: rgba(180, 79, 255, 0.15); color: var(--neon-purple); }
  .q-type-badge.fill   { background: rgba(0, 255, 136, 0.15); color: var(--neon-green); }

  .q-text {
    font-size: 1.1rem;
    line-height: 1.7;
    margin-bottom: 24px;
    color: var(--text-main);
  }
  .q-text code {
    background: rgba(0, 255, 136, 0.1);
    border: 1px solid rgba(0, 255, 136, 0.2);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.95rem;
    color: var(--neon-green);
  }

  /* 选项 */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .option-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 18px;
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(255,255,255,0.02);
  }
  .option-item:hover {
    border-color: var(--neon-blue);
    background: rgba(0, 200, 255, 0.06);
  }
  .option-item.selected {
    border-color: var(--neon-cyan);
    background: rgba(0, 255, 255, 0.08);
  }
  .option-item.correct {
    border-color: var(--neon-green);
    background: rgba(0, 255, 136, 0.12);
  }
  .option-item.wrong {
    border-color: var(--neon-red);
    background: rgba(255, 68, 102, 0.12);
  }
  .option-item.disabled {
    pointer-events: none;
  }
  .option-letter {
    min-width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(0, 200, 255, 0.12);
    color: var(--neon-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
    font-family: 'Orbitron', sans-serif;
  }
  .option-item.selected .option-letter {
    background: var(--neon-cyan);
    color: #0a0e1a;
  }
  .option-item.correct .option-letter {
    background: var(--neon-green);
    color: #0a0e1a;
  }
  .option-item.wrong .option-letter {
    background: var(--neon-red);
    color: #fff;
  }
  .option-text {
    font-size: 0.95rem;
    line-height: 1.5;
    padding-top: 3px;
  }
  .option-text code {
    background: rgba(0, 255, 136, 0.1);
    border: 1px solid rgba(0, 255, 136, 0.2);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.88rem;
    color: var(--neon-green);
  }

  /* 多选提示 */
  .multi-hint {
    font-size: 0.78rem;
    color: var(--neon-purple);
    margin-bottom: 14px;
    font-family: 'Share Tech Mono', monospace;
  }

  /* 填空题输入 */
  .fill-input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .fill-prompt {
    font-family: 'Share Tech Mono', monospace;
    color: var(--neon-green);
    font-size: 1rem;
    white-space: nowrap;
  }
  .fill-input {
    flex: 1;
    background: rgba(0, 200, 255, 0.06);
    border: 1.5px solid var(--neon-blue);
    border-radius: 8px;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    padding: 12px 16px;
    outline: none;
    transition: box-shadow 0.3s;
  }
  .fill-input:focus {
    box-shadow: 0 0 16px rgba(0, 200, 255, 0.5);
  }
  .fill-input.correct {
    border-color: var(--neon-green);
    box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
  }
  .fill-input.wrong {
    border-color: var(--neon-red);
    box-shadow: 0 0 12px rgba(255, 68, 102, 0.4);
  }
  .fill-answer-hint {
    font-size: 0.82rem;
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .fill-answer-hint.visible { opacity: 1; }
  .fill-hint-text {
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 6px;
    font-family: 'Share Tech Mono', monospace;
  }

  /* 按钮 */
  .btn-submit {
    display: block;
    width: 100%;
    max-width: 720px;
    margin: 24px auto 0;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-submit.active {
    background: linear-gradient(135deg, #00c8ff, #00ff88);
    color: #0a0e1a;
    box-shadow: 0 0 20px rgba(0, 200, 255, 0.4);
  }
  .btn-submit.active:hover {
    transform: scale(1.02);
    box-shadow: 0 0 32px rgba(0, 200, 255, 0.6);
  }
  .btn-submit.disabled {
    background: rgba(255,255,255,0.06);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .btn-back-map {
    display: inline-block;
    margin-top: 16px;
    padding: 8px 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .btn-back-map:hover {
    border-color: var(--neon-blue);
    color: var(--neon-blue);
  }

  /* ======= 关卡结果屏 ======= */
  #screen-result {
    display: none;
    min-height: 100vh;
    padding: 40px 20px;
    text-align: center;
  }
  .result-card {
    max-width: 560px;
    margin: 0 auto;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 20px;
    padding: 48px 36px;
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 5px;
    background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan), var(--neon-purple));
  }
  .result-icon {
    font-size: 4rem;
    margin-bottom: 16px;
  }
  .result-title {

  .stats-actions {

  /* ======= Toast ======= */
  .toast {
    position: fixed;

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div id="stars-bg"></div>
<div id="app">
  <!-- 标题屏 -->

<script>
// ===================================================================
// ================ 题库数据（每关20题，基于PPT教学内容）================
// ===================================================================

const ZONES = [
  {
    id: 1,
    name: '基础命令区',
    desc: 'Shell概念 / 目录操作 / 文件管理',
    color: '#00ff88',
    questions: [
      // --- 概念选择题 ---
      { type:'single', question:'Linux中，用户与内核之间的接口叫做什么？', options:['Shell','BIOS','GUI','API'], answer:0, score:5 },
      { type:'single', question:'以下哪个不是Linux中常见的Shell？', options:['bash','sh','zsh','cmd'], answer:3, score:5 },
      { type:'single', question:'Linux命令的一般格式为：命令名 [选项] [参数]。选项通常以什么符号开头？', options:['/','-','@','#'], answer:1, score:5 },
      { type:'single', question:'在终端中，~ 符号代表什么含义？', options:['根目录','当前用户的主目录','上一级目录','临时目录'], answer:1, score:5 },
      { type:'single', question:'在Linux中，使用什么命令可以查看当前所在的绝对路径？', options:['cd','dir','pwd','path'], answer:2, score:5 },
      { type:'single', question:'以下哪个命令可以查看当前目录下的文件列表（含隐藏文件）？', options:['ls -l','ls -a','ls -r','ls -d'], answer:1, score:5 },
      { type:'single', question:'硬链接和软链接的区别，以下说法正确的是？', options:['硬链接删除源文件后仍可访问','软链接删除源文件后仍可访问','两者完全相同','硬链接可以跨文件系统'], answer:0, score:5 },
      { type:'single', question:'重定向符号 > 的作用是什么？', options:['将命令输出追加到文件','将命令输出覆盖写入文件','读取文件内容','连接两个命令'], answer:1, score:5 },
      { type:'single', question:'管道符号 | 的作用是什么？', options:['同时执行两个命令','将前一个命令的输出作为后一个命令的输入','将错误信息输出到文件','连接两个文件'], answer:1, score:5 },
      { type:'single', question:'vim编辑器中，从命令模式切换到插入模式应按哪个键？', options:['Esc','i',':','dd'], answer:1, score:5 },
      // --- 命令选择题 ---
      { type:'single', question:'要创建一个名为 mydir 的目录，应使用什么命令？', options:['file mydir','mkdir mydir','newdir mydir','touch mydir'], answer:1, score:5 },
      { type:'single', question:'要递归删除目录 mydir 及其内容，应使用什么命令？', options:['rm -r mydir','del mydir','rmdir mydir','erase mydir'], answer:0, score:5 },
      // --- 填空题（实际敲代码）---
      { type:'fill', question:'切换到 /home/user 目录，请输入命令（完整命令）', answer:'cd /home/user', hint:'cd <路径>', score:5 },
      { type:'fill', question:'创建空文件 readme.txt，请输入命令', answer:'touch readme.txt', hint:'touch <文件名>', score:5 },
      { type:'fill', question:'将 file1.txt 复制为 file2.txt，请输入命令', answer:'cp file1.txt file2.txt', hint:'cp <源> <目标>', score:5 },
      { type:'fill', question:'将 old.txt 重命名为 new.txt，请输入命令', answer:'mv old.txt new.txt', hint:'mv <旧名> <新名>', score:5 },
      { type:'fill', question:'将目录 mydir 打包为 mydir.tar.gz，请输入命令', answer:'tar -czvf mydir.tar.gz mydir', hint:'tar -czvf <包名> <目录>', score:5 },

// ===================================================================
// ============================= 游戏逻辑 =============================
// ===================================================================

const STATE = {
  playerName: '探险者',
  zoneStatus: [1, 0, 0, 0, 0, 0], // 0=锁定, 1=可用, 2=通关 (6关)
  zoneScores: [0, 0, 0, 0, 0, 0],
  totalScore: 0,
  currentZone: null,
  currentQ: 0,
  currentScore: 0,
  selectedOptions: [],
  answered: false,
  shuffleSeed: [],  // 记录每关的题目随机顺序
  zoneProgress: [null, null, null, null, null, null], // 记录每关未完成挑战的进度
  answerHistory: [] // 记录每道题的答题结果 [{zoneIdx, qIdx, type, correct, userAnswer, rightAnswer}]
};

const PASS_PERCENT = 60;
const SCORE_STORAGE_KEY = 'linux-map-game-score-records';

// 初始化星空背景
function initStars() {
  const bg = document.getElementById('stars-bg');
  for (let i = 0; i < 120; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    star.style.animationDuration = (2 + Math.random() * 3) + 's';
    bg.appendChild(star);
  }
}

// 显示Toast
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// 切换屏幕（必须显式设置display值，不能用空字符串，否则CSS的display:none会生效）
const SCREEN_DISPLAY = {
  'screen-title':  'flex',
  'screen-map':    'block',
  'screen-quiz':   'block',
  'screen-result': 'block',
  'screen-final':  'block',
  'screen-stats':  'block'
};
const ALL_SCREENS = ['screen-title','screen-map','screen-quiz','screen-result','screen-final','screen-stats'];
function showScreen(id) {
  ALL_SCREENS.forEach(s => {
    document.getElementById(s).style.display = (s === id) ? SCREEN_DISPLAY[s] : 'none';
  });
}

// 开始游戏
function startGame() {
  const nameInput = document.getElementById('player-name').value.trim();
  STATE.playerName = nameInput || '探险者';
  STATE.zoneStatus = [1, 0, 0, 0, 0, 0];
  STATE.zoneScores = [0, 0, 0, 0, 0, 0];
  STATE.totalScore = 0;
  STATE.answerHistory = [];
  STATE.zoneProgress = [null, null, null, null, null, null];
  // 为每关生成随机顺序
  STATE.shuffleSeed = ZONES.map(z => shuffleArray([...Array(z.questions.length).keys()]));
  document.getElementById('map-player-name').textContent = STATE.playerName;
  document.getElementById('avatar-letter').textContent = STATE.playerName.charAt(0).toUpperCase();
  showScreen('screen-map');
  renderMap();
}

// Fisher-Yates 洗牌
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 渲染地图
function renderMap() {
  const grid = document.getElementById('zones-grid');
  const completedZones = STATE.zoneStatus.filter(s => s === 2).length;
  document.getElementById('map-total-score').textContent = STATE.totalScore;
  document.getElementById('map-progress-fill').style.width = (completedZones / 6 * 100) + '%';

  // 计算评级
  const rank = getRank();
  document.getElementById('map-player-rank').textContent = 'RANK: ' + rank;

  let html = '';
  ZONES.forEach((zone, idx) => {
    const status = STATE.zoneStatus[idx];
    const cls = status === 0 ? 'locked' : (status === 2 ? 'completed' : 'available');
    const bossCls = zone.isBoss ? ' boss-zone' : '';
    const progress = STATE.zoneProgress[idx];
    const progressText = progress && status !== 2 ? ` | 进度: ${progress.currentQ}/${zone.questions.length}` : '';
    html += `
      <div class="zone-card ${cls}${bossCls}" onclick="${status === 0 ? '' : 'enterZone('+idx+')'}">
        ${status === 0 ? '<div class="zone-lock-icon">&#x1f512;</div>' : ''}
        ${status === 2 ? '<div class="zone-check-icon">&#x2714;</div>' : ''}
        ${zone.isBoss ? '<div class="zone-boss-badge">&#x1f525; BOSS</div>' : ''}
        <div class="zone-badge">${status === 2 ? '&#x2714;' : zone.id}</div>
        <div class="zone-name">${zone.name}</div>
        <div class="zone-desc">${zone.desc}</div>
        <div class="zone-qcount">${zone.questions.length} QUESTIONS${status === 2 ? ' | SCORE: ' + STATE.zoneScores[idx] : progressText}</div>
        ${zone.isBoss && status === 0 ? '<div class="zone-boss-hint">&#x1f512; 通关前5关解锁</div>' : ''}
      </div>`;
  });
  grid.innerHTML = html;

  // 绘制连线SVG
  const svg = document.getElementById('map-svg');
  svg.innerHTML = '';
}

// 进入关卡
function enterZone(zoneIdx) {
  if (STATE.zoneStatus[zoneIdx] === 0) return;
  STATE.currentZone = zoneIdx;
  const savedProgress = STATE.zoneProgress[zoneIdx];
  STATE.currentQ = savedProgress ? savedProgress.currentQ : 0;
  STATE.currentScore = savedProgress ? savedProgress.currentScore : 0;
  STATE.answered = false;
  STATE.selectedOptions = [];

  const zone = ZONES[zoneIdx];

  if (STATE.currentQ >= zone.questions.length) {
    showZoneResult();
    return;
  }

  // Boss关卡：先显示场景描述
  if (zone.isBoss && zone.scenario && !savedProgress) {
    showScreen('screen-quiz');
    document.getElementById('quiz-zone-name').textContent = `ZONE ${zone.id}: ${zone.name}`;
    // 渲染场景介绍卡
    const card = document.getElementById('question-card');
    card.innerHTML = `
      <div class="boss-scenario">
        <div class="boss-scenario-icon">&#x1f3e2;</div>
        <div class="boss-scenario-title">企业实战场景</div>
        <div class="boss-scenario-text">${escapeHtml(zone.scenario)}</div>
        <div class="boss-scenario-hint">&#x1f4dd; 共 ${zone.questions.length} 道实操题，涵盖全部五大知识领域</div>
        <button class="btn-result primary" onclick="renderQuestion()" style="margin-top:20px;">&#x1f680; 开始挑战</button>
      </div>
    `;
    // 重置提交按钮
    const btn = document.getElementById('btn-submit');
    btn.className = 'btn-submit disabled';
    btn.textContent = 'SUBMIT';
    return;
  }

  showScreen('screen-quiz');
  document.getElementById('quiz-zone-name').textContent = `ZONE ${zone.id}: ${zone.name}`;
  renderQuestion();
}

// HTML转义：防止题目/提示中的 < > " & 破坏HTML结构
function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function normalizeCommand(str) {
  return String(str).replace(/\s+/g, ' ').trim().toLowerCase();
}

function getAnswerList(answer) {
  return Array.isArray(answer) ? answer : [answer];
}

function getAnswerText(answer) {
  return getAnswerList(answer).join(' 或 ');
}

function isFillAnswerCorrect(question, userAnswer) {
  const userNorm = normalizeCommand(userAnswer);
  return getAnswerList(question.answer).some(ans => normalizeCommand(ans) === userNorm);
}

function getZoneTotalScore(zone) {
  return zone.questions.reduce((sum, q) => sum + (q.score || 0), 0);
}

function getZonePassScore(zone) {
  return Math.ceil(getZoneTotalScore(zone) * PASS_PERCENT / 100);
}

function clearZoneHistory(zoneIdx) {
  STATE.answerHistory = STATE.answerHistory.filter(r => r.zoneIdx !== zoneIdx);
}

function saveZoneProgress() {
  if (STATE.currentZone === null) return;
  STATE.zoneProgress[STATE.currentZone] = {
    currentQ: Math.min(STATE.currentQ + 1, ZONES[STATE.currentZone].questions.length),
    currentScore: STATE.currentScore
  };
}

function resetZoneProgress(zoneIdx) {
  STATE.zoneProgress[zoneIdx] = null;
}

function getAccuracyStats() {
  const records = STATE.answerHistory;
  const answered = records.length;
  const correct = records.filter(r => r.correct).length;
  return {
    answered,
    correct,
    wrong: answered - correct,
    accuracy: answered > 0 ? Math.round(correct / answered * 100) : 0
  };
}

function buildScoreRecord() {
  const maxScore = ZONES.reduce((sum, z) => sum + getZoneTotalScore(z), 0);
  const stats = getAccuracyStats();
  const zones = ZONES.map((zone, idx) => {
    const zoneRecords = STATE.answerHistory.filter(r => r.zoneIdx === idx);
    const answered = zoneRecords.length;
    const correct = zoneRecords.filter(r => r.correct).length;
    return {
      id: zone.id,
      name: zone.name,
      score: STATE.zoneScores[idx],
      maxScore: getZoneTotalScore(zone),
      status: STATE.zoneStatus[idx] === 2 ? 'cleared' : (STATE.zoneStatus[idx] === 1 ? 'available' : 'locked'),
      answered,
      correct,
      accuracy: answered > 0 ? Math.round(correct / answered * 100) : 0
    };
  });

  return {
    savedAt: new Date().toLocaleString('zh-CN', { hour12: false }),
    playerName: STATE.playerName,
    totalScore: STATE.totalScore,
    maxScore,
    percent: maxScore > 0 ? Math.round(STATE.totalScore / maxScore * 100) : 0,
    rank: getRank(),
    summary: stats,
    zones
  };
}

function loadLocalScoreRecords() {
  try {
    return JSON.parse(localStorage.getItem(SCORE_STORAGE_KEY) || '[]');
  } catch (e) {
    return [];
  }
}

function saveRecordToLocalStorage(record) {
  const records = loadLocalScoreRecords();
  records.push(record);
  localStorage.setItem(SCORE_STORAGE_KEY, JSON.stringify(records));
  return records;
}

async function saveScoreToFile() {
  const record = buildScoreRecord();
  const records = saveRecordToLocalStorage(record);
  const content = JSON.stringify(records, null, 2);
  const fileName = 'linux-map-game-scores.json';

  try {
    if (window.showSaveFilePicker) {
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{
          description: 'JSON 成绩文件',
          accept: { 'application/json': ['.json'] }
        }]
      });
      const writable = await handle.createWritable();
      await writable.write(content);
      await writable.close();
      showToast('成绩已写入本地文件');
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') {
      showToast('已取消保存');
      return;
    }
  }

  const blob = new Blob([content], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('成绩文件已下载');
}

// 渲染题目
function renderQuestion() {
  const zone = ZONES[STATE.currentZone];
  const qIdx = STATE.shuffleSeed[STATE.currentZone][STATE.currentQ];
  const q = zone.questions[qIdx];
  STATE.answered = false;
  STATE.selectedOptions = [];

  document.getElementById('quiz-progress-text').textContent = `${STATE.currentQ + 1} / ${zone.questions.length}`;
  document.getElementById('quiz-score-text').textContent = STATE.currentScore;
  document.getElementById('quiz-progress-fill').style.width = ((STATE.currentQ) / zone.questions.length * 100) + '%';

  const btn = document.getElementById('btn-submit');
  btn.className = 'btn-submit disabled';
  btn.textContent = 'SUBMIT';

  const card = document.getElementById('question-card');

  let typeBadge = '';
  if (q.type === 'single') typeBadge = '<span class="q-type-badge single">单选题</span>';
  else if (q.type === 'multi') typeBadge = '<span class="q-type-badge multi">多选题</span>';
  else typeBadge = '<span class="q-type-badge fill">填空题</span>';

  let body = '';

  if (q.type === 'fill') {
    // 填空题：不把hint放入placeholder（避免引号破坏属性），改用DOM操作
    body = `
      <div class="fill-input-wrap">
        <span class="fill-prompt">$ </span>
        <input class="fill-input" id="fill-input" placeholder="输入命令..." autocomplete="off">
      </div>
      <div class="fill-hint-text" id="fill-hint-text"></div>
      <div class="fill-answer-hint" id="fill-hint"></div>
    `;
  } else {
    const letters = ['A','B','C','D','E','F'];
    const optHtml = q.options.map((opt, i) => `
      <div class="option-item" onclick="selectOption(${i})" data-idx="${i}">
        <div class="option-letter">${letters[i]}</div>
        <div class="option-text">${escapeHtml(opt)}</div>
      </div>
    `).join('');
    body = q.type === 'multi' ? '<div class="multi-hint">&#x2714; 多选题：请选择所有正确答案</div>' + optHtml : optHtml;
  }

  card.innerHTML = `
    <div class="q-number">QUESTION ${STATE.currentQ + 1} ${typeBadge}</div>
    <div class="q-text">${escapeHtml(q.question)}</div>
    ${body}
  `;

  // 填空题：用DOM API安全设置placeholder和hint，避免引号问题
  if (q.type === 'fill') {
    setTimeout(() => {
      const input = document.getElementById('fill-input');
      const hintEl = document.getElementById('fill-hint-text');
      if (input) {
        input.placeholder = q.hint || '输入命令...';
        input.focus();
        // Enter键提交
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') submitAnswer();
        });
      }
      // 显示格式提示
      if (hintEl && q.hint) {
        hintEl.textContent = '💡 提示格式: ' + q.hint;
      }
    }, 100);
  }
}

// 选择选项
function selectOption(idx) {
  if (STATE.answered) return;
  const zone = ZONES[STATE.currentZone];
  const qIdx = STATE.shuffleSeed[STATE.currentZone][STATE.currentQ];
  const q = zone.questions[qIdx];

  if (q.type === 'single') {
    STATE.selectedOptions = [idx];
    document.querySelectorAll('.option-item').forEach((el, i) => {
      el.classList.toggle('selected', i === idx);
    });
    document.getElementById('btn-submit').className = 'btn-submit active';
  } else if (q.type === 'multi') {
    const pos = STATE.selectedOptions.indexOf(idx);
    if (pos >= 0) STATE.selectedOptions.splice(pos, 1);
    else STATE.selectedOptions.push(idx);
    STATE.selectedOptions.sort();
    document.querySelectorAll('.option-item').forEach((el, i) => {
      el.classList.toggle('selected', STATE.selectedOptions.includes(i));
    });
    document.getElementById('btn-submit').className = STATE.selectedOptions.length > 0 ? 'btn-submit active' : 'btn-submit disabled';
  }
}

// 提交答案
function submitAnswer() {
  if (STATE.answered) return;

  const zone = ZONES[STATE.currentZone];
  const qIdx = STATE.shuffleSeed[STATE.currentZone][STATE.currentQ];
  const q = zone.questions[qIdx];

  if (q.type === 'fill') {
    const input = document.getElementById('fill-input');
    const userAnswer = input.value.trim();
    if (!userAnswer) return;
    STATE.answered = true;

    const isCorrect = isFillAnswerCorrect(q, userAnswer);

    input.classList.add(isCorrect ? 'correct' : 'wrong');
    input.disabled = true;

    if (!isCorrect) {
      const hint = document.getElementById('fill-hint');
      hint.textContent = '正确答案: ' + getAnswerText(q.answer);
      hint.classList.add('visible');
    }

    if (isCorrect) {
      STATE.currentScore += q.score;
      spawnParticles(window.innerWidth / 2, window.innerHeight / 2, '#00ff88');
      showScorePopup(window.innerWidth / 2, window.innerHeight / 2 - 40, '+' + q.score, true);
    } else {
      showScorePopup(window.innerWidth / 2, window.innerHeight / 2 - 40, '0', false);
    }
    // 记录填空题答题历史
    STATE.answerHistory.push({
      zoneIdx: STATE.currentZone,
      qIdx: qIdx,
      type: 'fill',
      correct: isCorrect,
      userAnswer: userAnswer,
      rightAnswer: getAnswerText(q.answer)
    });
    saveZoneProgress();
  } else {
    if (q.type === 'single' && STATE.selectedOptions.length === 0) return;
    if (q.type === 'multi' && STATE.selectedOptions.length === 0) return;
    STATE.answered = true;

    const isCorrect = q.type === 'single'
      ? STATE.selectedOptions[0] === q.answer
      : JSON.stringify(STATE.selectedOptions.sort()) === JSON.stringify([...q.answer].sort());

    // 标记正确/错误选项
    document.querySelectorAll('.option-item').forEach((el, i) => {
      el.classList.add('disabled');
      if (q.type === 'single') {
        if (i === q.answer) el.classList.add('correct');
        if (i === STATE.selectedOptions[0] && i !== q.answer) el.classList.add('wrong');
      } else {
        if (q.answer.includes(i)) el.classList.add('correct');
        if (STATE.selectedOptions.includes(i) && !q.answer.includes(i)) el.classList.add('wrong');
      }
    });

    if (isCorrect) {
      STATE.currentScore += q.score;
      spawnParticles(window.innerWidth / 2, window.innerHeight / 2, '#00ff88');
      showScorePopup(window.innerWidth / 2, window.innerHeight / 2 - 40, '+' + q.score, true);
    } else {
      showScorePopup(window.innerWidth / 2, window.innerHeight / 2 - 40, '0', false);
    }
    // 记录选择题答题历史
    const letters = ['A','B','C','D','E','F'];
    STATE.answerHistory.push({
      zoneIdx: STATE.currentZone,
      qIdx: qIdx,
      type: q.type,
      correct: isCorrect,
      userAnswer: STATE.selectedOptions.map(i => letters[i]).join(''),
      rightAnswer: q.type === 'single' ? letters[q.answer] : [...q.answer].map(i => letters[i]).join('')
    });
    saveZoneProgress();
  }

  document.getElementById('quiz-score-text').textContent = STATE.currentScore;
  const btn = document.getElementById('btn-submit');
  btn.textContent = 'NEXT';
  btn.className = 'btn-submit active';
  // 不再手动设置btn.onclick，由handleBtnClick统一路由
}

// 下一题
function nextQuestion() {
  STATE.currentQ++;
  if (STATE.currentQ >= ZONES[STATE.currentZone].questions.length) {
    showZoneResult();
  } else {
    renderQuestion();
  }
}

// 显示关卡结果
function showZoneResult() {
  const zone = ZONES[STATE.currentZone];
  const total = getZoneTotalScore(zone);
  const passScore = getZonePassScore(zone);
  const passed = STATE.currentScore >= passScore;
  const percent = Math.round(STATE.currentScore / total * 100);

  // 只有通过才标记通关、更新总分、解锁下一关
  if (passed) {
    STATE.zoneStatus[STATE.currentZone] = 2;
    STATE.zoneScores[STATE.currentZone] = STATE.currentScore;
    resetZoneProgress(STATE.currentZone);
    STATE.totalScore = STATE.zoneScores.reduce((a, b) => a + b, 0);
    // 解锁下一关（前5关顺序解锁第2-5关；Boss关不解锁新关）
    if (STATE.currentZone < 4) {
      STATE.zoneStatus[STATE.currentZone + 1] = 1;
    }
    // 前5关全部通关后，解锁Boss关（第6关）
    if (STATE.currentZone <= 4 && STATE.zoneStatus.slice(0, 5).every(s => s === 2)) {
      STATE.zoneStatus[5] = 1;
    }
  }

  showScreen('screen-result');
  document.getElementById('result-card').innerHTML = `
    <div class="result-icon">${passed ? '&#x1f389;' : '&#x1f614;'}</div>
    <div class="result-title">${passed ? 'ZONE CLEARED!' : 'ZONE FAILED'}</div>
    <div class="result-score">${STATE.currentScore} / ${total}</div>
    <div class="result-detail">${zone.name} | 正确率 ${percent}% | ${passed ? '通关成功' : '需要达到' + PASS_PERCENT + '%（' + passScore + '分）才能通关，再试一次吧！'}</div>
    <div class="result-buttons">
      ${passed && STATE.currentZone < 5 ? '<button class="btn-result primary" onclick="nextZone()">下一关</button>' : ''}
      ${!passed ? '<button class="btn-result primary" onclick="retryZone()">重新挑战</button>' : ''}
      <button class="btn-result secondary" onclick="showStatsScreen()">&#x1f4ca; 查看统计</button>
      <button class="btn-result secondary" onclick="saveScoreToFile()">保存成绩</button>
      <button class="btn-result secondary" onclick="backToMap()">返回地图</button>
    </div>
  `;

  if (passed) {
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        spawnParticles(
          Math.random() * window.innerWidth,
          Math.random() * window.innerHeight,
          zone.color
        );
      }, i * 200);
    }
  }
}

// 进入下一关
function nextZone() {
  enterZone(STATE.currentZone + 1);
}

// 重试当前关卡
function retryZone() {
  clearZoneHistory(STATE.currentZone);
  resetZoneProgress(STATE.currentZone);
  enterZone(STATE.currentZone);
}

// 返回地图
function backToMap() {
  showScreen('screen-map');
  renderMap();

  // 检查是否全部通关（仅已通关的关卡计入，未通关的可以继续挑战）
  const allCleared = STATE.zoneStatus.every(s => s === 2);
  if (allCleared) {
    setTimeout(showFinalScreen, 600);
  }
}

// 显示最终结果
function showFinalScreen() {
  const total = ZONES.reduce((sum, z) => sum + getZoneTotalScore(z), 0);
  const percent = Math.round(STATE.totalScore / total * 100);
  const rank = getRank();
  const rankClass = rank === 'S' ? 's-rank' : (rank === 'A' ? 'a-rank' : (rank === 'B' ? 'b-rank' : 'c-rank'));

  let zonesHtml = ZONES.map((z, i) => `
    <div class="final-zone-chip">
      <div class="chip-name">ZONE ${z.id}: ${z.name}</div>
      <div class="chip-score">${STATE.zoneScores[i]} / ${getZoneTotalScore(z)}</div>
    </div>
  `).join('');

  showScreen('screen-final');
  document.getElementById('final-card').innerHTML = `
    <div class="final-rank ${rankClass}">${rank}</div>
    <div class="final-title">MISSION COMPLETE</div>
    <div class="final-score">TOTAL SCORE: ${STATE.totalScore} / ${total} (${percent}%)</div>
    <div class="final-zones-summary">${zonesHtml}</div>
    <div class="result-buttons">
      <button class="btn-result primary" onclick="showStatsScreen()">&#x1f4ca; 查看统计</button>
      <button class="btn-result secondary" onclick="saveScoreToFile()">保存成绩</button>
      <button class="btn-result secondary" onclick="restartGame()">重新挑战</button>
      <button class="btn-result secondary" onclick="backToMap()">返回地图</button>
    </div>
  `;

  // 烟花效果
  for (let i = 0; i < 10; i++) {
    setTimeout(() => {
      spawnParticles(
        Math.random() * window.innerWidth,
        Math.random() * window.innerHeight,
        ['#00ff88','#00c8ff','#b44fff','#ffd700','#ff4466'][i % 5]
      );
    }, i * 300);
  }
}

// 重新开始
function restartGame() {
  STATE.zoneStatus = [1, 0, 0, 0, 0, 0];
  STATE.zoneScores = [0, 0, 0, 0, 0, 0];
  STATE.totalScore = 0;
  STATE.answerHistory = [];
  STATE.zoneProgress = [null, null, null, null, null, null];
  STATE.shuffleSeed = ZONES.map(z => shuffleArray([...Array(z.questions.length).keys()]));
  showScreen('screen-title');
}

// 获取评级
function getRank() {
  const maxScore = ZONES.reduce((sum, z) => sum + getZoneTotalScore(z), 0);
  const percent = STATE.totalScore / maxScore;
  if (percent >= 0.9) return 'S';
  if (percent >= 0.8) return 'A';
  if (percent >= 0.6) return 'B';
  return 'C';
}

// 粒子爆炸效果
function spawnParticles(x, y, color) {
  for (let i = 0; i < 16; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = color;
    const angle = (Math.PI * 2 / 16) * i + Math.random() * 0.3;
    const dist = 40 + Math.random() * 80;
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.width = (3 + Math.random() * 5) + 'px';
    p.style.height = p.style.width;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}

// 得分弹窗
function showScorePopup(x, y, text, positive) {
  const el = document.createElement('div');
  el.className = 'score-popup ' + (positive ? 'positive' : 'negative');
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.transform = 'translateX(-50%)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

// 初始化
window.addEventListener('DOMContentLoaded', () => {
  initStars();
  showScreen('screen-title');
  // 统一绑定提交按钮事件（避免HTML onclick与JS onclick冲突）
  document.getElementById('btn-submit').addEventListener('click', handleBtnClick);
});

// ===================================================================
// ========================= 统计正确率模块 ===========================
// ===================================================================

function showStatsScreen() {
  const h = STATE.answerHistory;
  if (h.length === 0) {
    showToast('还没有答题记录哦，先去挑战一关吧！');
    return;
  }

  // — 总体统计 —
  const totalAnswered = h.length;
  const totalCorrect = h.filter(r => r.correct).length;
  const overallPct = Math.round(totalCorrect / totalAnswered * 100);

  // — 各关卡统计 —
  const zoneStats = ZONES.map((zone, idx) => {
    const zoneRecords = h.filter(r => r.zoneIdx === idx);
    const answered = zoneRecords.length;
    const correct = zoneRecords.filter(r => r.correct).length;
    const pct = answered > 0 ? Math.round(correct / answered * 100) : 0;
    return { zone, idx, answered, correct, pct, total: zone.questions.length };
  });

  // — 各题型统计 —
  const typeMap = [
    { key: 'single', name: '单选题', icon: '🔘' },
    { key: 'multi',  name: '多选题', icon: '☑️' },
    { key: 'fill',   name: '填空题', icon: '⌨️' }
  ];
  const typeStats = typeMap.map(t => {
    const records = h.filter(r => r.type === t.key);
    const answered = records.length;
    const correct = records.filter(r => r.correct).length;
    const pct = answered > 0 ? Math.round(correct / answered * 100) : 0;
    return { ...t, answered, correct, pct };
  });

  // — 构建关卡进度条 HTML —
  const zoneColors = ['#00ff88', '#b44fff', '#00c8ff', '#ffd700', '#ff4466', '#ff6b35'];
  const zoneBarsHtml = zoneStats.map((zs, i) => `
    <div class="stats-zone-bar-item">
      <div class="stats-zone-bar-name">ZONE ${i+1} ${zs.zone.name}</div>
      <div class="stats-zone-bar-track">
        <div class="stats-zone-bar-fill" style="width:${zs.pct}%;background:${zoneColors[i]};"></div>
      </div>
      <div class="stats-zone-bar-pct">${zs.pct}%</div>
    </div>
  `).join('');

  // — 题型统计 HTML —
  const typeCardsHtml = typeStats.map(ts => `
    <div class="stats-type-card">
      <div class="stats-type-icon">${ts.icon}</div>
      <div class="stats-type-name">${ts.name}</div>
      <div class="stats-type-pct" style="color:${ts.pct >= 60 ? 'var(--neon-green)' : 'var(--neon-red)'}">${ts.pct}%</div>
      <div class="stats-type-detail">${ts.correct} / ${ts.answered} 正确</div>
    </div>
  `).join('');

  // — 答题详情 HTML（按关卡分组） —
  let detailHtml = '';
  ZONES.forEach((zone, zIdx) => {
    const zoneRecords = h.filter(r => r.zoneIdx === zIdx);
    if (zoneRecords.length === 0) return;
    detailHtml += `<div class="stats-detail-zone-header" style="color:${zoneColors[zIdx]}">ZONE ${zIdx+1}: ${zone.name}</div>`;
    zoneRecords.forEach((r, ri) => {
      const q = zone.questions[r.qIdx];
      const qText = escapeHtml(q.question.length > 50 ? q.question.substring(0, 50) + '...' : q.question);
      const typeLabel = r.type === 'fill' ? '填空' : (r.type === 'multi' ? '多选' : '单选');
      const yourAnsClass = r.correct ? 'your-ans' : 'your-ans wrong-ans';
      detailHtml += `
        <div class="stats-detail-item">
          <div class="stats-detail-status ${r.correct ? 'correct' : 'wrong'}">${r.correct ? '✓' : '✗'}</div>
          <div class="stats-detail-q">[${typeLabel}] ${qText}</div>
          <div class="stats-detail-answers">
            <div class="${r.correct ? 'your-ans' : yourAnsClass}">你的: ${escapeHtml(r.userAnswer)}</div>
            <div class="right-ans">正确: ${escapeHtml(r.rightAnswer)}</div>
          </div>
        </div>
      `;
    });
  });

  // — 渲染 —
  showScreen('screen-stats');
  document.getElementById('stats-card').innerHTML = `
    <div class="stats-header">
      <div class="stats-title">&#x1f4ca; ACCURACY STATS</div>
      <button class="btn-result secondary" onclick="backToMap()">返回地图</button>
    </div>

    <div class="stats-overall">
      <div class="stats-overall-percent">${overallPct}%</div>
      <div class="stats-overall-label">总体正确率</div>
      <div class="stats-overall-detail">
        <div class="stats-overall-item"><div class="num green">${totalCorrect}</div><div class="lbl">答对</div></div>
        <div class="stats-overall-item"><div class="num red">${totalAnswered - totalCorrect}</div><div class="lbl">答错</div></div>
        <div class="stats-overall-item"><div class="num gold">${totalAnswered}</div><div class="lbl">已答</div></div>
        <div class="stats-overall-item"><div class="num" style="color:var(--text-dim)">${ZONES.reduce((s,z)=>s+z.questions.length,0) - totalAnswered}</div><div class="lbl">未答</div></div>
      </div>
    </div>

    <div class="stats-section-title">各关卡正确率</div>
    <div class="stats-zone-bars">${zoneBarsHtml}</div>

    <div class="stats-section-title">各题型正确率</div>
    <div class="stats-type-grid">${typeCardsHtml}</div>

    <div class="stats-section-title">答题详情</div>
    <div class="stats-detail-list">${detailHtml}</div>

    <div class="stats-actions">
      <button class="btn-result primary" onclick="saveScoreToFile()">保存成绩</button>
      <button class="btn-result primary" onclick="backToMap()">返回地图</button>
      <button class="btn-result secondary" onclick="restartGame()">重新开始</button>
    </div>
  `;
}

// 按钮点击路由：根据当前状态分发到 submitAnswer 或 nextQuestion
function handleBtnClick() {
  if (STATE.answered) {
    nextQuestion();
  } else {
    submitAnswer();
  }
}
</script>
