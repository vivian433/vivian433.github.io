<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linux 地图探险游戏</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08111f;color:#eaf2ff;font-family:Arial,'Microsoft YaHei',sans-serif}button,input{font:inherit}.bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#123a54,transparent 28%),radial-gradient(circle at 80% 5%,#3b1d5f,transparent 26%),linear-gradient(135deg,#07101d,#10172a);z-index:-1}.screen{display:none;min-height:100vh;padding:24px}.show{display:block}.center{display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}.panel{width:min(980px,100%);margin:auto;background:rgba(10,22,42,.88);border:1px solid rgba(69,219,255,.32);border-radius:16px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.35)}h1{font-size:clamp(32px,7vw,62px);margin:0 0 12px;background:linear-gradient(90deg,#00ff9d,#39c9ff,#b86bff);-webkit-background-clip:text;color:transparent;letter-spacing:2px}.sub{color:#88dfff;margin:0 0 28px}.name{width:min(320px,90%);padding:13px 16px;border-radius:10px;border:1px solid #39c9ff;background:#091827;color:white;text-align:center}.btn{border:0;border-radius:10px;padding:12px 20px;margin:6px;cursor:pointer;font-weight:700}.primary{background:linear-gradient(90deg,#00ff9d,#39c9ff);color:#07101d}.secondary{background:rgba(255,255,255,.08);color:#eaf2ff;border:1px solid rgba(255,255,255,.16)}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.score{color:#ffd75e;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.screen{padding:14px}.panel{padding:18px}}.zone{position:relative;min-height:150px;padding:18px;border-radius:14px;background:#101d33;border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.2s}.zone:hover{transform:translateY(-3px)}.zone.locked{opacity:.42;cursor:not-allowed;filter:grayscale(.8)}.zone.available{border-color:#39c9ff;box-shadow:0 0 20px rgba(57,201,255,.24)}.zone.done{border-color:#00ff9d;box-shadow:0 0 20px rgba(0,255,157,.18)}.badge{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#143a55;color:#39c9ff;font-weight:900}.zname{font-size:18px;font-weight:800;margin:12px 0 5px}.desc{color:#9fb1cc;font-size:13px}.qcard{margin-top:18px}.qtext{font-size:21px;line-height:1.55;margin:12px 0 18px}.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin:10px 0;padding:13px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);cursor:pointer}.opt.sel{border-color:#39c9ff;background:rgba(57,201,255,.12)}.opt.ok{border-color:#00ff9d;background:rgba(0,255,157,.14)}.opt.bad{border-color:#ff5470;background:rgba(255,84,112,.14)}.letter{min-width:28px;height:28px;border-radius:50%;background:#16324c;display:flex;align-items:center;justify-content:center;color:#39c9ff;font-weight:800}.cmd{width:100%;padding:14px;border-radius:10px;border:1px solid #39c9ff;background:#071523;color:white;font-family:Consolas,monospace}.hint{color:#9fb1cc;font-size:13px;margin-top:8px}.bar{height:10px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#00ff9d,#39c9ff);width:0}.result{text-align:center}.big{font-size:46px;color:#ffd75e;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}}.stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px}.stat b{display:block;font-size:24px;color:#00ff9d}.table{width:100%;border-collapse:collapse;margin-top:16px}.table td,.table th{border-bottom:1px solid rgba(255,255,255,.12);padding:10px;text-align:left}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10243d;border:1px solid #39c9ff;border-radius:10px;padding:12px 18px;opacity:0;transition:.2s}.toast.on{opacity:1}
</style>
</head>
<body>
<div class="bg"></div>
<section id="title" class="screen show center"><div class="panel"><h1>Linux 地图探险</h1><p class="sub">闯过六大区域，完成 Linux 运维挑战</p><input id="player" class="name" placeholder="输入挑战者名字" maxlength="16"><br><br><button class="btn primary" onclick="startGame()">开始挑战</button><p class="hint">成绩可保存为本地 JSON 文件，方便统计挑战者名字和分数。</p></div></section>
<section id="map" class="screen"><div class="panel"><div class="top"><div><b id="who">探险者</b><div class="hint" id="rank">RANK C</div></div><div class="score">总分 <span id="total">0</span></div><button class="btn secondary" onclick="showStats()">统计</button></div><div class="bar"><span id="progress"></span></div><h2>选择关卡</h2><div id="zones" class="grid"></div></div></section>
<section id="quiz" class="screen"><div class="panel"><div class="top"><b id="zoneName"></b><span id="qProg" class="score"></span><span>本关得分 <b id="qScore">0</b></span></div><div class="bar"><span id="qBar"></span></div><div id="question" class="qcard"></div><button id="submit" class="btn primary" onclick="mainButton()">提交</button><button class="btn secondary" onclick="backMap()">返回地图</button></div></section>
<section id="result" class="screen"><div class="panel result" id="resultBox"></div></section>
<section id="stats" class="screen"><div class="panel" id="statsBox"></div></section>
<div id="toast" class="toast"></div>
<script>
const ZONES=[
{name:'基础命令区',desc:'Shell / 目录 / 文件',color:'#00ff9d',qs:[{t:'s',q:'Linux 中用户与内核之间的接口叫做什么？',o:['Shell','BIOS','GUI','API'],a:0},{t:'s',q:'查看当前所在绝对路径的命令是？',o:['cd','dir','pwd','path'],a:2},{t:'s',q:'硬链接和软链接的区别，正确的是？',o:['硬链接删除源文件后仍可访问','软链接删除源文件后仍可访问','两者完全相同','硬链接可以跨文件系统'],a:0},{t:'f',q:'创建空文件 readme.txt',a:['touch readme.txt'],h:'touch <文件名>'},{t:'f',q:'vim 中保存并退出',a:[':wq',':x'],h:':wq 或 :x'}]},
{name:'用户管理区',desc:'用户 / 组 / sudo',color:'#39c9ff',qs:[{t:'s',q:'UID 为 0 的用户通常是？',o:['admin','root','guest','system'],a:1},{t:'s',q:'真正存储加密密码的文件是？',o:['/etc/passwd','/etc/shadow','/etc/group','/etc/hosts'],a:1},{t:'f',q:'创建用户 student',a:['useradd student'],h:'useradd <用户名>'},{t:'f',q:'为 student 设置密码',a:['passwd student'],h:'passwd <用户名>'},{t:'f',q:'切换到 root 用户',a:['su - root','su -'],h:'su - root 或 su -'}]},
{name:'网络配置区',desc:'网络命令 / 防火墙 / SSH',color:'#b86bff',qs:[{t:'s',q:'SSH 默认端口号是多少？',o:['21','22','80','443'],a:1},{t:'s',q:'测试网络连通性的命令是？',o:['netstat','ping','nslookup','ifconfig'],a:1},{t:'f',q:'查看所有网络接口信息',a:['ifconfig','ip addr','ip a'],h:'ifconfig 或 ip addr'},{t:'f',q:'发送 4 个包 ping 192.168.1.1',a:['ping -c 4 192.168.1.1'],h:'ping -c <次数> <IP>'},{t:'f',q:'查看监听中的 TCP 端口',a:['netstat -tlnp','ss -tlnp'],h:'netstat -tlnp 或 ss -tlnp'}]},
{name:'文件权限区',desc:'chmod / chown / ACL',color:'#ff5470',qs:[{t:'s',q:'权限 rwxr-xr-- 用数字表示是？',o:['755','754','764','644'],a:1},{t:'s',q:'Sticky Bit 常用于哪个目录？',o:['/home','/tmp','/var','/etc'],a:1},{t:'m',q:'哪些是 Linux 特殊权限位？',o:['SUID','SGID','Sticky Bit','SUDP'],a:[0,1,2]},{t:'f',q:'将 script.sh 权限设置为 755',a:['chmod 755 script.sh'],h:'chmod <数字> <文件>'},{t:'f',q:'将 file.txt 所有者改为 root',a:['chown root file.txt'],h:'chown <用户> <文件>'}]},
{name:'软件管理区',desc:'RPM / YUM / 下载',color:'#ffd75e',qs:[{t:'s',q:'YUM 的主要作用是？',o:['管理网络','自动解决依赖的软件包管理器','管理用户','编译源码'],a:1},{t:'s',q:'查询所有已安装 RPM 包的命令是？',o:['rpm -qa','rpm -ql','rpm -qi','rpm -qc'],a:0},{t:'f',q:'使用 YUM 安装 gcc',a:['yum install gcc','yum install gcc -y'],h:'yum install <包名>'},{t:'f',q:'使用 wget 下载 http://example.com/file.zip',a:['wget http://example.com/file.zip'],h:'wget <URL>'},{t:'f',q:'查看 vim 包详细信息',a:['rpm -qi vim'],h:'rpm -qi <包名>'}]},
{name:'综合实操挑战',desc:'企业案例 Boss 关',color:'#ff8a45',boss:true,qs:[{t:'s',q:'CentOS 7 安装 Apache 应使用哪个包管理器？',o:['apt','yum','dnf','pacman'],a:1},{t:'f',q:'创建项目目录 /projects/webapp',a:['mkdir -p /projects/webapp'],h:'mkdir -p <路径>'},{t:'f',q:'永久开放 80/tcp 端口',a:['firewall-cmd --zone=public --add-port=80/tcp --permanent','firewall-cmd --add-port=80/tcp --permanent'],h:'firewall-cmd --add-port=80/tcp --permanent'},{t:'f',q:'重新加载防火墙规则',a:['firewall-cmd --reload'],h:'firewall-cmd --reload'},{t:'f',q:'启动 httpd 并设为开机自启',a:['systemctl enable --now httpd'],h:'systemctl enable --now httpd'}]}
];
const PASS=60,STORE='linux-map-game-score-records';
let S={name:'探险者',status:[1,0,0,0,0,0],scores:[0,0,0,0,0,0],total:0,z:0,q:0,score:0,sel:[],answered:false,order:[],history:[]};
function $(id){return document.getElementById(id)}function screen(id){['title','map','quiz','result','stats'].forEach(x=>$(x).classList.toggle('show',x===id))}function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1800)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function norm(s){return String(s).replace(/\s+/g,' ').trim().toLowerCase()}function ansList(a){return Array.isArray(a)?a:[a]}function totalZone(z){return z.qs.length*5}function passScore(z){return Math.ceil(totalZone(z)*PASS/100)}function rank(){let max=ZONES.reduce((a,z)=>a+totalZone(z),0),p=S.total/max;return p>=.9?'S':p>=.8?'A':p>=.6?'B':'C'}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){S.name=$('player').value.trim()||'探险者';S.status=[1,0,0,0,0,0];S.scores=[0,0,0,0,0,0];S.total=0;S.history=[];S.order=ZONES.map(z=>shuffle([...z.qs.keys()]));$('who').textContent=S.name;screen('map');renderMap()}
function renderMap(){$('total').textContent=S.total;$('rank').textContent='RANK '+rank();$('progress').style.width=(S.status.filter(x=>x===2).length/6*100)+'%';$('zones').innerHTML=ZONES.map((z,i)=>{let st=S.status[i],c=st===0?'locked':st===2?'done':'available';return `<div class="zone ${c}" onclick="enter(${i})"><div class="badge">${st===2?'✓':i+1}</div><div class="zname">${z.name}${z.boss?' BOSS':''}</div><div class="desc">${z.desc}</div><div class="hint">${z.qs.length} 题 ${st===2?'| '+S.scores[i]+'分':''}</div>${st===0?'<div class="hint">未解锁</div>':''}</div>`}).join('')}
function enter(i){if(S.status[i]===0)return;S.history=S.history.filter(r=>r.z!==i);S.z=i;S.q=0;S.score=0;screen('quiz');$('zoneName').textContent='ZONE '+(i+1)+' '+ZONES[i].name;renderQ()}
function renderQ(){let z=ZONES[S.z],q=z.qs[S.order[S.z][S.q]];S.sel=[];S.answered=false;$('qProg').textContent=(S.q+1)+' / '+z.qs.length;$('qScore').textContent=S.score;$('qBar').style.width=(S.q/z.qs.length*100)+'%';$('submit').textContent='提交';let body='';if(q.t==='f'){body=`<input id="cmd" class="cmd" placeholder="输入命令..." autocomplete="off"><div class="hint">提示: ${esc(q.h||'输入完整命令')}</div><div id="right" class="hint"></div>`}else{body=(q.t==='m'?'<div class="hint">多选题：请选择所有正确答案</div>':'')+q.o.map((o,i)=>`<button class="opt" onclick="pick(${i})"><span class="letter">${'ABCDEF'[i]}</span><span>${esc(o)}</span></button>`).join('')}$('question').innerHTML=`<div class="hint">${q.t==='f'?'填空题':q.t==='m'?'多选题':'单选题'}</div><div class="qtext">${esc(q.q)}</div>${body}`;let input=$('cmd');if(input)input.onkeydown=e=>{if(e.key==='Enter')submit()}}
function pick(i){if(S.answered)return;let q=ZONES[S.z].qs[S.order[S.z][S.q]];if(q.t==='s')S.sel=[i];else{let p=S.sel.indexOf(i);p>=0?S.sel.splice(p,1):S.sel.push(i);S.sel.sort()}document.querySelectorAll('.opt').forEach((el,n)=>el.classList.toggle('sel',S.sel.includes(n)))}
function submit(){if(S.answered)return;let z=ZONES[S.z],qi=S.order[S.z][S.q],q=z.qs[qi],ok=false,user='',right='';if(q.t==='f'){let input=$('cmd');user=input.value.trim();if(!user)return;ok=ansList(q.a).some(a=>norm(a)===norm(user));right=ansList(q.a).join(' 或 ');input.disabled=true;if(!ok)$('right').textContent='正确答案: '+right}else{if(!S.sel.length)return;ok=q.t==='s'?S.sel[0]===q.a:JSON.stringify(S.sel.sort())===JSON.stringify([...q.a].sort());user=S.sel.map(i=>'ABCDEF'[i]).join('');right=q.t==='s'?'ABCDEF'[q.a]:q.a.map(i=>'ABCDEF'[i]).join('');document.querySelectorAll('.opt').forEach((el,i)=>{el.disabled=true;let good=q.t==='s'?i===q.a:q.a.includes(i);if(good)el.classList.add('ok');if(S.sel.includes(i)&&!good)el.classList.add('bad')})}S.answered=true;if(ok)S.score+=5;S.history.push({z:S.z,q:qi,type:q.t,correct:ok,userAnswer:user,rightAnswer:right});$('qScore').textContent=S.score;$('submit').textContent='下一题'}
function mainButton(){S.answered?nextQ():submit()}function nextQ(){S.q++;S.q>=ZONES[S.z].qs.length?showResult():renderQ()}
function showResult(){let z=ZONES[S.z],total=totalZone(z),need=passScore(z),ok=S.score>=need,pct=Math.round(S.score/total*100);if(ok){S.status[S.z]=2;S.scores[S.z]=S.score;S.total=S.scores.reduce((a,b)=>a+b,0);if(S.z<4)S.status[S.z+1]=1;if(S.status.slice(0,5).every(x=>x===2))S.status[5]=1}screen('result');$('resultBox').innerHTML=`<h2>${ok?'闯关成功':'闯关失败'}</h2><div class="big">${S.score} / ${total}</div><p>${z.name} | 正确率 ${pct}% | ${ok?'已通关':'需要达到 '+PASS+'%（'+need+'分）'}</p><button class="btn primary" onclick="${ok&&S.z<5?'enter(S.z+1)':'enter(S.z)'}">${ok&&S.z<5?'下一关':'重新挑战'}</button><button class="btn secondary" onclick="showStats()">查看统计</button><button class="btn secondary" onclick="saveScore()">保存成绩</button><button class="btn secondary" onclick="backMap()">返回地图</button>`}
function backMap(){screen('map');renderMap();if(S.status.every(x=>x===2))setTimeout(finalScreen,300)}function finalScreen(){screen('result');$('resultBox').innerHTML=`<h2>MISSION COMPLETE</h2><div class="big">RANK ${rank()}</div><p>总分 ${S.total} / ${ZONES.reduce((a,z)=>a+totalZone(z),0)}</p><button class="btn primary" onclick="showStats()">查看统计</button><button class="btn secondary" onclick="saveScore()">保存成绩</button><button class="btn secondary" onclick="startGame()">重新挑战</button>`}
function statsObj(){let a=S.history.length,c=S.history.filter(x=>x.correct).length;return{answered:a,correct:c,wrong:a-c,accuracy:a?Math.round(c/a*100):0}}function buildRecord(){let max=ZONES.reduce((a,z)=>a+totalZone(z),0),sum=statsObj();return{savedAt:new Date().toLocaleString('zh-CN',{hour12:false}),playerName:S.name,totalScore:S.total,maxScore:max,percent:Math.round(S.total/max*100),rank:rank(),summary:sum,zones:ZONES.map((z,i)=>{let r=S.history.filter(x=>x.z===i),c=r.filter(x=>x.correct).length;return{id:i+1,name:z.name,score:S.scores[i],maxScore:totalZone(z),status:S.status[i]===2?'cleared':S.status[i]===1?'available':'locked',answered:r.length,correct:c,accuracy:r.length?Math.round(c/r.length*100):0}})}}function saveScore(){let rec=buildRecord(),arr=[];try{arr=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){}arr.push(rec);localStorage.setItem(STORE,JSON.stringify(arr));let blob=new Blob([JSON.stringify(arr,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='linux-map-game-scores.json';a.click();URL.revokeObjectURL(url);toast('成绩文件已保存/下载')}
function showStats(){let st=statsObj();screen('stats');$('statsBox').innerHTML=`<div class="top"><h2>成绩统计</h2><button class="btn secondary" onclick="backMap()">返回地图</button></div><div class="stats"><div class="stat"><b>${S.total}</b>总分</div><div class="stat"><b>${rank()}</b>评级</div><div class="stat"><b>${st.accuracy}%</b>正确率</div><div class="stat"><b>${st.answered}</b>已答题</div></div><table class="table"><tr><th>关卡</th><th>分数</th><th>状态</th><th>正确率</th></tr>${buildRecord().zones.map(z=>`<tr><td>${z.name}</td><td>${z.score}/${z.maxScore}</td><td>${z.status}</td><td>${z.accuracy}%</td></tr>`).join('')}</table><br><button class="btn primary" onclick="saveScore()">保存成绩</button><button class="btn secondary" onclick="backMap()">返回地图</button>`}
</script>
</body>
</html>
